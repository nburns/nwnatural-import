name: NW Natural Import
version: "0.1.4"
slug: nwnatural_import
description: Pull NW Natural monthly gas usage + billed cost into Home Assistant long-term statistics.
url: https://github.com/nburns/nwnatural-import
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
# --- security lockdown ---
# The add-on only needs to reach HA Core's WebSocket via the supervisor
# proxy. That requires `homeassistant_api` (which populates SUPERVISOR_TOKEN).
# hassio_api / auth_api / docker_api are all left off deliberately.
homeassistant_api: true
hassio_api: false
auth_api: false
docker_api: false
host_network: false
host_pid: false
host_ipc: false
host_dbus: false
privileged: []      # no capabilities
devices: []         # no host device access
usb: false
uart: false
kernel_modules: false
full_access: false
apparmor: true      # loads apparmor.txt
ingress: false
panel_icon: mdi:fire
options:
  username: ""
  password: ""
  account_no: ""
  statistic_id: "nwnatural:gas_consumption"
  statistic_name: "NW Natural gas consumption"
  cost_statistic_id: "nwnatural:gas_cost"
  cost_statistic_name: "NW Natural gas cost"
  schedule: "17 6 * * *"
  run_backfill_on_start: true
schema:
  username: str
  password: password
  account_no: str?
  statistic_id: str
  statistic_name: str
  cost_statistic_id: str
  cost_statistic_name: str
  schedule: str
  run_backfill_on_start: bool
