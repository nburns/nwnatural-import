[project]
name = "nwnatural-import"
version = "0.1.0"
description = "Pull NW Natural Green Button data into Home Assistant long-term statistics."
readme = "README.md"
authors = [
    { name = "Nick Burns", email = "nick@burns.io" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
nwnatural-import = "nwnatural_import.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"
